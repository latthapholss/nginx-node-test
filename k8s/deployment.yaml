apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-node-test
  namespace: default
  annotations:
    keel.sh/policy: all
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
  labels:
    app: nginx-node-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-node-test
  template:
    metadata:
      labels:
        app: nginx-node-test
    spec:
      # Secret สำหรับดึง Image จาก Harbor PRD (Private Registry)
      imagePullSecrets:
        - name: harbor-prd-secret
      containers:
        - name: nginx-node-test
          # ดึง Image จาก Harbor PRD (Tag ถูกจัดการผ่าน k8s/kustomization.yaml โดย Argo CD Image Updater)
          image: 10.5.3.56:8443/prd/nginx-node-test:v1.0.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

