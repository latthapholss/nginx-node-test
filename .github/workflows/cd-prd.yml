name: "2. CD - Promote and Deploy to Harbor PRD"

on:
  workflow_run:
    workflows: ["1. CI - Build and Push to Harbor UAT"]  # 👈 เชื่อมกับชื่อ Pipeline UAT
    types:
      - completed
    branches: [ "main", "uat" ]  # 👈 รองรับการดักฟังทั้งรอบที่รันบน main และ uat

jobs:
  promote-and-deploy:
    # ⭐️ เงื่อนไขที่ 1: ปลุกอัตโนมัติเฉพาะตอนที่ Pipeline UAT ผ่านฉลุย (success) เท่านั้น
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    env:
      APP_NAME: nginx-node-test
      TAG: ${{ github.event.workflow_run.head_sha }}
      UAT_PROJECT: uat
      PRD_PROJECT: prd

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # STEP 1: Login ทั้งสอง Registry
      # ==========================================
      - name: 2. Login to Harbor UAT
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_UAT_URL }}
          username: ${{ secrets.HARBOR_UAT_USER }}
          password: ${{ secrets.HARBOR_UAT_SECRET }}

      - name: 3. Login to Harbor PRD
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_PRD_URL }}
          username: ${{ secrets.HARBOR_PRD_USER }}
          password: ${{ secrets.HARBOR_PRD_SECRET }}

      # ==========================================
      # STEP 2: Retag & Push ขึ้น Harbor PRD (latest & v1.0.0)
      # ==========================================
      - name: 4. Retag and Push to Harbor PRD
        run: |
          # ดึงเวอร์ชันจาก package.json (เช่น 1.0.0 -> v1.0.0)
          APP_VER="v$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")"
          echo "🏷️ Version Tag: $APP_VER"

          UAT_BASE="${{ secrets.HARBOR_UAT_URL }}/${{ env.UAT_PROJECT }}/${{ env.APP_NAME }}"
          PRD_BASE="${{ secrets.HARBOR_PRD_URL }}/${{ env.PRD_PROJECT }}/${{ env.APP_NAME }}"

          UAT_IMG="${UAT_BASE}:${{ env.TAG }}"
          PRD_SHA="${PRD_BASE}:${{ env.TAG }}"
          PRD_VER="${PRD_BASE}:${APP_VER}"
          PRD_LATEST="${PRD_BASE}:latest"

          echo "📥 ตรวจสอบ Image จาก Harbor UAT..."
          docker pull "$UAT_IMG" || true

          echo "📦 กำลังโปรโมต Image จาก UAT ไป PRD (Tags: $APP_VER, latest)..."
          docker tag "$UAT_IMG" "$PRD_SHA"
          docker tag "$UAT_IMG" "$PRD_VER"
          docker tag "$UAT_IMG" "$PRD_LATEST"
          docker push "$PRD_SHA"
          docker push "$PRD_VER"
          docker push "$PRD_LATEST"
          echo "✅ Push เข้า Harbor PRD สำเร็จเรียบร้อย (Tags: $APP_VER, latest)!"

      # ==========================================
      # STEP 3: Deploy ด้วย Tag latest (และ v1.0.0)
      # ==========================================
      - name: 5. Deploy Application (Pull latest & Version Tag from Harbor PRD)
        if: success()  # ⭐️ เงื่อนไขที่ 2: ต้อง Push เข้า Harbor PRD ผ่านก่อนเท่านั้น ถึงจะสั่ง Deploy
        run: |
          APP_VER="v$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")"
          PRD_BASE="${{ secrets.HARBOR_PRD_URL }}/${{ env.PRD_PROJECT }}/${{ env.APP_NAME }}"
          DEPLOY_IMG="${PRD_BASE}:latest"
          VERSION_IMG="${PRD_BASE}:${APP_VER}"

          echo "🚀 ดึง Image จาก Harbor PRD ไป Deploy (Tag: latest & $APP_VER)..."
          docker pull "$DEPLOY_IMG"
          docker pull "$VERSION_IMG" || true

          docker rm -f nginx-node-test-app 2>/dev/null || true
          docker run -d \
            --name nginx-node-test-app \
            -p 3001:3000 \
            --restart always \
            "$DEPLOY_IMG"

          sleep 3
          if curl -s -I http://localhost:3001 | grep -q "200 OK"; then
            echo "✅ Deploy สำเร็จ! แอปพลิเคชันเวอร์ชัน ($APP_VER / latest) พร้อมใช้งานที่ http://localhost:3001"
          else
            echo "⚠️ ตรวจสอบสถานะแอปพลิเคชัน"
            exit 1
          fi

      # ==========================================
      # STEP 4: แจ้งเตือนสถานะสำเร็จ
      # ==========================================
      - name: 6. Notify Success
        if: success()
        run: |
          APP_VER="v$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")"
          echo "🎉 ครบ Loop สมบูรณ์: Push UAT ➔ Auto-Trigger PRD ➔ Deploy สำเร็จ!"
          echo "🏷️ Tags บน Harbor: latest และ $APP_VER"
