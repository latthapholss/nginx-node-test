name: "2. CD - Promote and Deploy to Harbor PRD"

on:
  workflow_run:
    workflows: ["1. CI - Build and Push to Harbor UAT"]  # 👈 เชื่อมกับชื่อ Pipeline UAT
    types:
      - completed
    branches: [ "uat" ]  # 👈 ดักฟังว่าถ้ารอบที่รันบน branch uat สำเร็จ

jobs:
  promote-and-deploy:
    # ⭐️ เงื่อนไขที่ 1: ปลุกอัตโนมัติเฉพาะตอนที่ Pipeline UAT ผ่านฉลุย (success) เท่านั้น
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    env:
      APP_NAME: nginx-node-test
      TAG: ${{ github.event.workflow_run.head_sha }}
      UAT_PROJECT: uat
      PRD_PROJECT: prd

    steps:
      # ==========================================
      # STEP 1: Login ทั้งสอง Registry
      # ==========================================
      - name: 1. Login to Harbor UAT
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_UAT_URL }}
          username: ${{ secrets.HARBOR_UAT_USER }}
          password: ${{ secrets.HARBOR_UAT_SECRET }}

      - name: 2. Login to Harbor PRD
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_PRD_URL }}
          username: ${{ secrets.HARBOR_PRD_USER }}
          password: ${{ secrets.HARBOR_PRD_SECRET }}

      # ==========================================
      # STEP 2: Retag & Push ขึ้น Harbor PRD
      # ==========================================
      - name: 3. Retag and Push to Harbor PRD
        run: |
          UAT_IMG="${{ secrets.HARBOR_UAT_URL }}/${{ env.UAT_PROJECT }}/${{ env.APP_NAME }}:${{ env.TAG }}"
          PRD_IMG="${{ secrets.HARBOR_PRD_URL }}/${{ env.PRD_PROJECT }}/${{ env.APP_NAME }}:${{ env.TAG }}"
          PRD_LATEST="${{ secrets.HARBOR_PRD_URL }}/${{ env.PRD_PROJECT }}/${{ env.APP_NAME }}:latest"

          echo "📥 ตรวจสอบ Image จาก Harbor UAT..."
          docker pull "$UAT_IMG" || true

          echo "📦 กำลังโปรโมต Image จาก UAT ไป PRD..."
          docker tag "$UAT_IMG" "$PRD_IMG"
          docker tag "$UAT_IMG" "$PRD_LATEST"
          docker push "$PRD_IMG"
          docker push "$PRD_LATEST"
          echo "✅ Push เข้า Harbor PRD สำเร็จเรียบร้อย!"

      # ==========================================
      # STEP 3: Deploy (ทำงานเฉพาะเมื่อ Push PRD สำเร็จเท่านั้น)
      # ==========================================
      - name: 4. Deploy Application (Run only if PRD Push Succeeded)
        if: success()  # ⭐️ เงื่อนไขที่ 2: ต้อง Push เข้า Harbor PRD ผ่านก่อนเท่านั้น ถึงจะสั่ง Deploy
        run: |
          DEPLOY_IMG="${{ secrets.HARBOR_PRD_URL }}/${{ env.PRD_PROJECT }}/${{ env.APP_NAME }}:${{ env.TAG }}"
          echo "🚀 ดึง Image จาก Harbor PRD ไป Deploy: $DEPLOY_IMG"
          docker pull "$DEPLOY_IMG"

          docker rm -f nginx-node-test-app 2>/dev/null || true
          docker run -d \
            --name nginx-node-test-app \
            -p 3001:3000 \
            --restart always \
            "$DEPLOY_IMG"

          sleep 3
          if curl -s -I http://localhost:3001 | grep -q "200 OK"; then
            echo "✅ Deploy สำเร็จ! เข้าใช้งานได้ที่ http://localhost:3001"
          else
            echo "⚠️ ตรวจสอบสถานะแอปพลิเคชัน"
            exit 1
          fi

      # ==========================================
      # STEP 4: แจ้งเตือนสถานะสำเร็จ
      # ==========================================
      - name: 5. Notify Success
        if: success()
        run: |
          echo "🎉 ครบ Loop สมบูรณ์: Push UAT สำเร็จ ➔ Auto-Trigger PRD สำเร็จ ➔ Deploy เรียบร้อย!"
          echo "🚀 Version Tag: ${{ env.TAG }}"
