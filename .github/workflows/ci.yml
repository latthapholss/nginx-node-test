name: "All-in-One: Build, Promote and Deploy (UAT & PRD)"

on:
  workflow_dispatch:  # เก็บวิธีแรกไว้ สามารถกดรัน Manual ได้ตลอดเวลา
  # push:
  #   branches: [ "main", "master" ]

jobs:
  build-and-promote:
    runs-on: self-hosted  # รันผ่าน Self-Hosted Runner บนเครื่อง Mac
    env:
      APP_NAME: nginx-node-test
      TAG: ${{ github.sha }}
      UAT_PROJECT: uat
      PRD_PROJECT: prd

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # STEP 1: Login & Push ไปยัง Harbor UAT
      # ==========================================
      - name: 2. Login to Harbor UAT
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_UAT_URL }}
          username: ${{ secrets.HARBOR_UAT_USER }}
          password: ${{ secrets.HARBOR_UAT_SECRET }}

      - name: 3. Build and Push to UAT
        run: |
          RAW_VER="$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")"
          CLEAN_VER="${RAW_VER#v}"
          APP_VER="v${CLEAN_VER}"
          UAT_BASE="${{ secrets.HARBOR_UAT_URL }}/${{ env.UAT_PROJECT }}/${{ env.APP_NAME }}"
          echo "🔨 กำลัง Build Docker Image (Tags: latest, $APP_VER)..."
          docker build \
            -t "${UAT_BASE}:${{ env.TAG }}" \
            -t "${UAT_BASE}:${APP_VER}" \
            -t "${UAT_BASE}:latest" .
          echo "📤 กำลัง Push Image ไปยัง Harbor UAT..."
          docker push "${UAT_BASE}:${{ env.TAG }}"
          docker push "${UAT_BASE}:${APP_VER}"
          docker push "${UAT_BASE}:latest"
          echo "✅ Push เข้า Harbor UAT สำเร็จ!"

      # ==========================================
      # STEP 2: Retag & Push ไปยัง Harbor PRD
      # ==========================================
      - name: 4. Login to Harbor PRD
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_PRD_URL }}
          username: ${{ secrets.HARBOR_PRD_USER }}
          password: ${{ secrets.HARBOR_PRD_SECRET }}

      - name: 5. Retag and Push to PRD
        run: |
          RAW_VER="$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.0")"
          CLEAN_VER="${RAW_VER#v}"
          APP_VER="v${CLEAN_VER}"
          UAT_IMG="${{ secrets.HARBOR_UAT_URL }}/${{ env.UAT_PROJECT }}/${{ env.APP_NAME }}:${{ env.TAG }}"
          PRD_BASE="${{ secrets.HARBOR_PRD_URL }}/${{ env.PRD_PROJECT }}/${{ env.APP_NAME }}"
          echo "📦 กำลังโปรโมต Image จาก UAT ไป PRD (Tags: latest, $APP_VER)..."
          docker tag "$UAT_IMG" "${PRD_BASE}:${{ env.TAG }}"
          docker tag "$UAT_IMG" "${PRD_BASE}:${APP_VER}"
          docker tag "$UAT_IMG" "${PRD_BASE}:latest"
          docker push "${PRD_BASE}:${{ env.TAG }}"
          docker push "${PRD_BASE}:${APP_VER}"
          docker push "${PRD_BASE}:latest"
          echo "✅ Push เข้า Harbor PRD สำเร็จ!"

      # ==========================================
      # STEP 3: แจ้งเตือนเมื่อทั้งคู่สำเร็จ
      # ==========================================
      - name: 6. Notify Success
        if: success()
        run: |
          echo "🎉 CI สำเร็จทั้งสองฝั่ง (UAT & PRD) แล้ว!"
          echo "🚀 Image Tag '${{ env.TAG }}' พร้อมนำไป Deploy บน Production ได้ทันที"
