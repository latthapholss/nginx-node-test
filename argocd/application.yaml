apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-node-test-prd
  namespace: argocd
  annotations:
    # เฝ้าดู Image บน Harbor PRD ที่ต้องการให้ Argo CD Image Updater ตรวจจับ
    argocd-image-updater.argoproj.io/image-list: app=10.5.3.56:8443/prd/nginx-node-test
    # กลยุทธ์ semver (เทียบเท่า keel.sh/policy: all) อัปเดตเมื่อมีเวอร์ชันใหม่กว่า เช่น v1.0.7 > v1.0.5
    argocd-image-updater.argoproj.io/app.update-strategy: semver
    # อนุญาตเฉพาะ Tag รูปแบบ SemVer ที่ขึ้นต้นด้วย v เช่น v1.0.7
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    # อัปเดตตรงเข้า Argo CD Application ทันที (ไม่ต้องใช้ PAT หรือ SSH Key เขียนกลับ Git)
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Git Repository ที่เก็บไฟล์ Kubernetes Manifests (อ่านแบบ Read-Only ผ่าน HTTPS)
    repoURL: https://github.com/latthapholss/nginx-node-test.git
    targetRevision: main
    path: k8s
  destination:
    # Cluster ปลายทาง (คลัสเตอร์ที่ติดตั้ง Argo CD)
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # ลบ resource ที่ถูกลบออกจาก Git อัตโนมัติ
      selfHeal: true   # แก้กลับให้ตรงกับ Git อัตโนมัติหากมีการแก้มือใน Cluster
    syncOptions:
      - CreateNamespace=true
