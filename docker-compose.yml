version: '3.8'

services:
  web:
    # ดึง Image จาก Harbor (รองรับทั้ง UAT และ PRD ผ่านตัวแปร)
    image: ${HARBOR_URL:-10.5.3.56}/${HARBOR_PROJECT:-uat}/nginx-node-test:${TAG:-latest}
    container_name: nginx-node-test-app
    ports:
      - "${APP_PORT:-3001}:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
