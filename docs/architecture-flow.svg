<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" rx="16" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <rect x="30" y="22" width="1140" height="58" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="57" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">🚀 End-to-End CI/CD Architecture &amp; Deployment Flow (GitHub Actions ➔ Harbor UAT &amp; PRD ➔ Deploy)</text>

  <!-- ==================== SECTION 1: SOURCE & CI RUNNER (TOP ROW) ==================== -->
  <!-- Developer Box -->
  <g filter="url(#shadow)">
    <rect x="30" y="105" width="185" height="125" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="105" width="185" height="34" rx="12" fill="url(#purpleGrad)"/>
    <text x="122" y="127" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1. DEVELOPER</text>
    <text x="122" y="162" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">💻 Local Code</text>
    <text x="122" y="185" fill="#94a3b8" font-size="12" text-anchor="middle">git push origin main</text>
    <rect x="52" y="197" width="140" height="22" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="122" y="212" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">branch: main</text>
  </g>

  <!-- Arrow: Dev -> GitHub -->
  <line x1="215" y1="167" x2="262" y2="167" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="238" y="157" fill="#93c5fd" font-size="11" text-anchor="middle">Push</text>

  <!-- GitHub Actions Box -->
  <g filter="url(#shadow)">
    <rect x="268" y="105" width="195" height="125" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="268" y="105" width="195" height="34" rx="12" fill="url(#blueGrad)"/>
    <text x="365" y="127" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2. GITHUB ACTIONS</text>
    <text x="365" y="162" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">🐙 Workflow Trigger</text>
    <text x="365" y="184" fill="#94a3b8" font-size="12" text-anchor="middle">.github/workflows/ci.yml</text>
    <rect x="290" y="197" width="150" height="22" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="365" y="212" fill="#a78bfa" font-size="11" font-family="monospace" text-anchor="middle">GitHub Secrets 🔐</text>
  </g>

  <!-- Arrow: GitHub -> Mac Runner -->
  <line x1="463" y1="167" x2="512" y2="167" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="487" y="157" fill="#93c5fd" font-size="11" text-anchor="middle">Job</text>

  <!-- Self-Hosted Runner Box -->
  <g filter="url(#shadow)">
    <rect x="518" y="95" width="652" height="145" rx="14" fill="#172554" fill-opacity="0.55" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="538" y="119" fill="#60a5fa" font-size="13" font-weight="700">🖥️ SELF-HOSTED RUNNER (บนเครื่อง Mac - ./run.sh)</text>

    <!-- Step A: Checkout & Single Build -->
    <rect x="535" y="132" width="190" height="92" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="630" y="155" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">3. Single Docker Build</text>
    <text x="630" y="176" fill="#94a3b8" font-size="12" text-anchor="middle">Checkout &amp; Build 1 ครั้ง</text>
    <rect x="550" y="188" width="160" height="24" rx="5" fill="#0f172a"/>
    <text x="630" y="204" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">docker build -t ...</text>

    <line x1="725" y1="178" x2="755" y2="178" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step B: Push UAT -->
    <rect x="761" y="132" width="185" height="92" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="853" y="155" fill="#2dd4bf" font-size="13" font-weight="700" text-anchor="middle">4. Push to UAT</text>
    <text x="853" y="176" fill="#94a3b8" font-size="12" text-anchor="middle">Login &amp; Push UAT</text>
    <rect x="774" y="188" width="160" height="24" rx="5" fill="#0f172a"/>
    <text x="853" y="204" fill="#2dd4bf" font-size="11" font-family="monospace" text-anchor="middle">10.5.3.56/uat/...</text>

    <line x1="946" y1="178" x2="974" y2="178" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step C: Retag & Promote PRD -->
    <rect x="980" y="132" width="174" height="92" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1067" y="155" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">5. Promote to PRD</text>
    <text x="1067" y="176" fill="#94a3b8" font-size="12" text-anchor="middle">Retag &amp; Push PRD</text>
    <rect x="992" y="188" width="150" height="24" rx="5" fill="#0f172a"/>
    <text x="1067" y="204" fill="#4ade80" font-size="11" font-family="monospace" text-anchor="middle">10.5.3.56:8443/prd</text>
  </g>

  <!-- ==================== SECTION 2: HARBOR REGISTRIES (MIDDLE ROW) ==================== -->
  <!-- Arrow from Step 4 to Harbor UAT -->
  <line x1="853" y1="224" x2="853" y2="275" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Arrow from Step 5 to Harbor PRD -->
  <line x1="1067" y1="224" x2="1067" y2="275" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="518" y="280" width="652" height="125" rx="14" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="2"/>
    <text x="538" y="305" fill="#34d399" font-size="13" font-weight="700">🐳 HARBOR CONTAINER REGISTRIES (Private Projects)</text>

    <!-- Harbor UAT -->
    <rect x="545" y="318" width="275" height="72" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
    <text x="682" y="342" fill="#2dd4bf" font-size="14" font-weight="700" text-anchor="middle">🏢 Harbor UAT (Port 443)</text>
    <text x="682" y="362" fill="#e2e8f0" font-size="12" font-family="monospace" text-anchor="middle">10.5.3.56/uat/nginx-node-test</text>
    <text x="682" y="380" fill="#94a3b8" font-size="11" text-anchor="middle">Tags: &lt;commit-sha&gt; , latest</text>

    <!-- Promotion Arrow between Harbors -->
    <line x1="820" y1="354" x2="870" y2="354" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
    <text x="845" y="344" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">Promote</text>

    <!-- Harbor PRD -->
    <rect x="876" y="318" width="275" height="72" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="1013" y="342" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">🚀 Harbor PRD (Port 8443)</text>
    <text x="1013" y="362" fill="#e2e8f0" font-size="12" font-family="monospace" text-anchor="middle">10.5.3.56:8443/prd/nginx-node-test</text>
    <text x="1013" y="380" fill="#94a3b8" font-size="11" text-anchor="middle">Tags: &lt;commit-sha&gt; , latest</text>
  </g>

  <!-- Key Benefits Callout on Left Middle -->
  <g filter="url(#shadow)">
    <rect x="30" y="280" width="460" height="125" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="308" fill="#fbbf24" font-size="13.5" font-weight="700">✨ จุดเด่นของสถาปัตยกรรมนี้ (Key Highlights)</text>
    <text x="50" y="334" fill="#e2e8f0" font-size="11.5">• <tspan fill="#38bdf8" font-weight="600">Single Build:</tspan> Build ครั้งเดียว การันตี UAT &amp; PRD เหมือนกัน 100%</text>
    <text x="50" y="358" fill="#e2e8f0" font-size="11.5">• <tspan fill="#34d399" font-weight="600">Immutable Tag:</tspan> ผูกกับเลข Git Commit SHA ตรวจสอบย้อนกลับได้</text>
    <text x="50" y="382" fill="#e2e8f0" font-size="11.5">• <tspan fill="#a78bfa" font-weight="600">Private Auth:</tspan> ล็อกอินด้วย Robot Account / Secret อย่างปลอดภัย</text>
  </g>

  <!-- ==================== SECTION 3: 3 DEPLOYMENT OPTIONS (BOTTOM ROW) ==================== -->
  <!-- Connector lines from Harbor PRD to 3 Deployment Options -->
  <path d="M 1013 405 L 1013 435 L 205 435 L 205 465" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M 1013 405 L 1013 435 L 595 435 L 595 465" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 1013 405 L 1013 465" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Option 1: Docker Host / VM -->
  <g filter="url(#shadow)">
    <rect x="30" y="470" width="350" height="260" rx="14" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="30" y="470" width="350" height="38" rx="14" fill="url(#orangeGrad)"/>
    <text x="205" y="494" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🅰️ แนวทางที่ 1: Docker Host / VM</text>

    <rect x="52" y="524" width="306" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="205" y="545" fill="#fb923c" font-size="13" font-weight="600" text-anchor="middle">1. CI สั่ง Pull Image จาก Harbor PRD</text>
    <text x="205" y="564" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">docker pull 10.5.3.56:8443/prd/...</text>

    <line x1="205" y1="576" x2="205" y2="596" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="52" y="600" width="306" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="205" y="621" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">2. รัน Container &amp; Health Check</text>
    <text x="205" y="640" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">docker run -d -p 3001:3000 --restart always</text>

    <rect x="52" y="668" width="306" height="44" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="205" y="695" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">✅ พร้อมใช้งานที่ http://localhost:3001</text>
  </g>

  <!-- Option 2: Kubernetes / Rancher Direct -->
  <g filter="url(#shadow)">
    <rect x="410" y="470" width="370" height="260" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="410" y="470" width="370" height="38" rx="14" fill="url(#blueGrad)"/>
    <text x="595" y="494" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🅱️ แนวทางที่ 2: Kubernetes / Rancher (Push)</text>

    <rect x="432" y="524" width="326" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="595" y="545" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">1. CI เชื่อมต่อ K8s ด้วย KUBECONFIG Secret</text>
    <text x="595" y="564" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">kubectl set image deployment/nginx-node-test</text>

    <line x1="595" y1="576" x2="595" y2="596" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="432" y="600" width="326" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="595" y="621" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">2. K8s ดึง Image ผ่าน imagePullSecrets</text>
    <text x="595" y="640" fill="#a78bfa" font-size="11" font-family="monospace" text-anchor="middle">secret: harbor-registry-secret</text>

    <rect x="432" y="668" width="326" height="44" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="595" y="695" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">☸️ Rolling Update Pods บน Rancher สำเร็จ</text>
  </g>

  <!-- Option 3: GitOps with Argo CD -->
  <g filter="url(#shadow)">
    <rect x="810" y="470" width="360" height="260" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="810" y="470" width="360" height="38" rx="14" fill="url(#greenGrad)"/>
    <text x="990" y="494" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🅲️ แนวทางที่ 3: GitOps ด้วย Argo CD ⭐</text>

    <rect x="832" y="524" width="316" height="46" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="990" y="544" fill="#4ade80" font-size="12.5" font-weight="600" text-anchor="middle">1. CI Commit เปลี่ยน Tag ใน k8s/deployment.yaml</text>
    <text x="990" y="561" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">git commit &amp; push (Single Source of Truth)</text>

    <line x1="990" y1="570" x2="990" y2="588" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="832" y="590" width="316" height="58" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="990" y="611" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">2. 🐙 Argo CD (รันใน Rancher K8s)</text>
    <text x="990" y="629" fill="#cbd5e1" font-size="11.5" text-anchor="middle">ตรวจพบ Git Commit ใหม่ ➔ Auto-Sync &amp; Self-Heal</text>
    <text x="990" y="643" fill="#34d399" font-size="10.5" font-family="monospace" text-anchor="middle">k8s/argocd-app.yaml</text>

    <rect x="832" y="664" width="316" height="48" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="990" y="685" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle">🔒 คลัสเตอร์ดึง Image จาก Harbor PRD อัตโนมัติ</text>
    <text x="990" y="703" fill="#a7f3d0" font-size="11" text-anchor="middle">(ไม่ต้องเปิดพอร์ต K8s ออกนอก / ไม่ต้องเก็บ Kubeconfig)</text>
  </g>
</svg>
